<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ember Black">
	<defs>
		<clipPath id="tile">
			<rect width="256" height="256" rx="58" />
		</clipPath>
		<radialGradient id="glow" cx="50%" cy="52%" r="52%">
			<stop offset="0%" stop-color="#d97757" stop-opacity="0.22" />
			<stop offset="55%" stop-color="#d97757" stop-opacity="0.07" />
			<stop offset="100%" stop-color="#d97757" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="256" height="256" rx="58" fill="#000000" />
	<g clip-path="url(#tile)">
		<rect width="256" height="256" fill="url(#glow)" />
	</g>

	<!-- the ember: middle arm, short, in the accent. Painted first so the spine
	     covers its left cap and the accent reads as growing out of the letter. -->
	<rect x="56" y="115" width="102" height="26" rx="13" fill="#d97757" />

	<!-- E: spine and two full arms in warm off-white -->
	<g fill="#f2f0ec">
		<rect x="56" y="56" width="26" height="144" rx="13" />
		<rect x="56" y="56" width="144" height="26" rx="13" />
		<rect x="56" y="174" width="144" height="26" rx="13" />
	</g>
</svg>
