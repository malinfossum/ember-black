<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ember Black">
	<defs>
		<clipPath id="tile">
			<rect width="256" height="256" rx="58" />
		</clipPath>
		<radialGradient id="glow" cx="50%" cy="55%" r="53%">
			<stop offset="0%" stop-color="#d97757" stop-opacity="0.24" />
			<stop offset="55%" stop-color="#d97757" stop-opacity="0.08" />
			<stop offset="100%" stop-color="#d97757" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="256" height="256" rx="58" fill="#000000" />
	<g clip-path="url(#tile)">
		<rect width="256" height="256" fill="url(#glow)" />
	</g>

	<!-- outer flame: tip hooks right, long sweep down the left -->
	<path
		d="M 150 30 C 137 76 191 112 191 155 C 191 193 163 219 128 219 C 93 219 65 193 65 155 C 65 111 130 84 150 30 Z"
		fill="#d97757" />

	<!-- inner core, echoing the hook, low where it burns hottest -->
	<path
		d="M 137 122 C 132 148 153 163 153 180 C 153 197 142 209 128 209 C 114 209 103 197 103 180 C 103 158 128 147 137 122 Z"
		fill="#e6d260" />
</svg>
